# Runs make check, make test and make docker-test, then builds and smoke tests the image (make
# smoke), so a broken image fails here rather than in the release workflow after the merge. On a
# dev/vX.Y.Z PR it also checks that docker-compose.yml pins the image that release will publish.
# The main ruleset requires this job's check, reported as "check", so keep the job id and add no
# job name.

name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check syntax and style
        run: make check
      - name: Test behavior
        run: make test
      - name: Test behavior under BusyBox sh
        run: make docker-test
      - name: Match the compose image tag to the release branch
        if: startsWith(github.head_ref, 'dev/v')
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          want=ghcr.io/${GITHUB_REPOSITORY,,}:${BRANCH#dev/}
          got=$(docker compose config --images)
          if [[ "$got" != "$want" ]]; then
            echo "::error file=docker-compose.yml::image is '$got', expected '$want' for $BRANCH"
            exit 1
          fi
      - name: Build image and smoke test it
        run: make smoke
